<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Landing Page</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e0e0e0;
        }

        #canvas {
            display: block;
            background: radial-gradient(circle, #ffffff 0%, #dcdcdc 100%);
        }

        .character-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        #boy-image {
            width: 120px;
            height: 120px;
            display: block;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="character-container">
        <img id="boy-image" src="https://via.placeholder.com/120/0000FF/FFFFFF?text=FRONT" alt="Character">
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const boyImg = document.getElementById('boy-image');

        // Assets Mapping (Swap these strings with your filenames later)
        const images = {
            front: "https://via.placeholder.com/120/0000FF/FFFFFF?text=FRONT",
            left: "https://via.placeholder.com/120/FF0000/FFFFFF?text=LEFT",
            right: "https://via.placeholder.com/120/00FF00/000000?text=RIGHT"
        };

        // Physics Configuration
        const gravity = 0.25;
        const bounce = -0.95; 
        const ballRadius = 25;
        
        let x, y, dx, dy;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            x = canvas.width / 2;
            y = 100;
            dx = 5;
            dy = 2;
        }

        function updateImage() {
            const midWidth = canvas.width / 2;
            const midHeight = canvas.height / 2;
            let nextSrc;

            if (y < midHeight) {
                nextSrc = images.front;
            } else if (x < midWidth) {
                nextSrc = images.left;
            } else {
                nextSrc = images.right;
            }

            // Only update the DOM if the source actually changes to prevent flickering
            if (boyImg.src !== nextSrc) {
                boyImg.src = nextSrc;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ball Shadow (Optional touch for depth)
            ctx.beginPath();
            ctx.ellipse(x, canvas.height - 5, ballRadius * (y/canvas.height), 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            ctx.fill();
            ctx.closePath();

            // The Basketball
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#FF8C00";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 3;
            ctx.fill();
            ctx.stroke();
            // Draw a simple basketball curve
            ctx.moveTo(x - ballRadius, y);
            ctx.quadraticCurveTo(x, y - ballRadius, x + ballRadius, y);
            ctx.stroke();
            ctx.closePath();

            updateImage();

            // Physics logic
            dy += gravity;
            x += dx;
            y += dy;

            // Floor bounce
            if (y + ballRadius > canvas.height) {
                y = canvas.height - ballRadius;
                dy *= bounce;
                if (Math.abs(dy) < 3) dy = -12; // "Perpetual motion" kick
            }
            // Ceiling bounce
            if (y - ballRadius < 0) {
                y = ballRadius;
                dy *= bounce;
            }
            // Wall bounce
            if (x + ballRadius > canvas.width || x - ballRadius < 0) {
                dx = -dx;
                x = (x - ballRadius < 0) ? ballRadius : canvas.width - ballRadius;
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();
    </script>
</body>
</html>

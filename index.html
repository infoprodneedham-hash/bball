<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Landing Page</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: sans-serif;
        }

        #canvas {
            display: block;
        }

        .character-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        #boy-image {
            width: 100px; /* Adjust size as needed */
            height: auto;
            transition: opacity 0.2s ease;
        }

        .content {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            pointer-events: none; /* Allows ball to "pass under" text */
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Welcome to the Site</h1>
        <p>Watch the ball and see the character react!</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="character-container">
        <img id="boy-image" src="front_boy.png" alt="Character">
    </div>

    <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const boyImg = document.getElementById('boy-image');

    // Physics Constants
    const gravity = 0.25;    // The downward pull
    const bounce = -0.98;    // Energy retained (0.98 prevents infinite speed gain)
    const ballRadius = 24;

    let x, y, dx, dy;
    
    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        x = canvas.width / 2;
        y = 50;   // Start near the top
        dx = 5;   // Initial horizontal push
        dy = 0;   // Start falling from rest
    }

    function updateImage() {
        const midWidth = canvas.width / 2;
        const midHeight = canvas.height / 2;

        if (y < midHeight) {
            boyImg.src = 'front_boy.png';
        } else if (x < midWidth) {
            boyImg.src = 'left_boy.png';
        } else {
            boyImg.src = 'right_boy.png';
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw Basketball
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#FF8C00";
        ctx.fill();
        ctx.stroke();
        ctx.closePath();

        updateImage();

        // Apply Gravity to Vertical Velocity
        dy += gravity;

        // Apply Velocity to Position
        x += dx;
        y += dy;

        // Floor Collision
        if (y + ballRadius > canvas.height) {
            y = canvas.height - ballRadius;
            dy *= bounce; // Reverse direction and lose a tiny bit of energy
            
            // "Never stop" logic: If it gets too slow, give it a boost
            if (Math.abs(dy) < 5) dy -= 10; 
        }

        // Ceiling Collision
        if (y - ballRadius < 0) {
            y = ballRadius;
            dy *= bounce;
        }

        // Wall Collisions
        if (x + ballRadius > canvas.width || x - ballRadius < 0) {
            dx = -dx;
        }

        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', init);
    init();
    draw();
</script>
</body>
</html>
